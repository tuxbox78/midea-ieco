name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is stdlib-only and stubs out msmart, so no project
      # dependencies are installed here. It only needs shellcheck, which is
      # preinstalled on GitHub's Ubuntu images (guarded install as a fallback).
      - name: Ensure shellcheck is available
        run: shellcheck --version || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Run the full test suite
        run: bash tests/run_all.sh

  install-smoke:
    name: Real dependency install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Unlike the `test` job (stdlib-only, msmart stubbed), this installs the
      # pinned dependencies for real and verifies the runtime imports resolve.
      # It exists to catch undeclared or version-conditional transitive deps and
      # Requires-Python mismatches — e.g. midea-local imports typing_extensions
      # without declaring it, and 6.7.0+ require Python 3.12 (which is why the
      # pin stays at 6.6.1 and the matrix starts at 3.11). Both are invisible to
      # the stubbed unit suite; this job is what catches them before release.
      - name: Install pinned dependencies for real
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Verify core imports resolve
        run: venv/bin/python -c "import midealocal.cli, msmart.device.AC.device; print('core imports OK')"

      - name: Verify midealocal discover import path
        run: venv/bin/python -m midealocal.cli discover --help

      # msmart-ng offers no public way to close a device connection, so
      # midea_conn.py reaches through the private chain device._lan._disconnect().
      # If a future release moves or renames it, close_connection() silently
      # becomes a no-op again — exactly the defect this replaced, where every
      # candidate leaked a connection to a unit that tolerates only one.
      #
      # This assertion can ONLY live here. The `test` job stubs msmart out, so
      # the same test skips itself there; running it against the stub would
      # check the fake and prove nothing. The test also re-checks the inverse:
      # should upstream ever ship a public close(), it fails and asks for the
      # workaround to be removed.
      #
      # MIDEA_IECO_REQUIRE_MSMART turns any skip into a failure. Without it the
      # guard could disable itself: unittest exits 0 on an all-skipped run, so a
      # crashed probe — a changed constructor signature, exactly the upstream
      # break this exists to catch — would read as a green build.
      - name: Verify the msmart-ng teardown contract still holds
        env:
          MIDEA_IECO_REQUIRE_MSMART: "1"
        run: venv/bin/python -m unittest tests.test_conn.MsmartContractTests -v
